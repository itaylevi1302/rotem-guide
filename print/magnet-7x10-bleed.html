<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>מגנט 7x10</title>
<link rel="stylesheet" href="common.css">
<style>
/* bleed: 0mm = exact 70x100; 3mm = 76x106 with background to the edge */
@page{size:76mm 106mm;margin:0}
.page{width:76mm;height:106mm;padding:8mm 8mm 7.5mm;display:flex;flex-direction:column;gap:1.5mm}
.head{display:flex;align-items:center;gap:2.4mm}
.head{justify-content:center}.head img{width:20mm;height:20mm}
.head div{display:flex;flex-direction:column;line-height:1.25}
.head b{font-size:3.4mm}
.head span{font-size:2.5mm;color:var(--soft);font-weight:600}
h1{font-family:var(--hand);font-size:4.6mm;color:var(--sage-ink);line-height:1.15;text-align:center}
.k{font-size:2.9mm;font-weight:800;color:var(--deep)}
.cues{display:flex;flex-wrap:wrap;gap:1.2mm}
.cues span{font-size:2.5mm;font-weight:700;background:var(--card);border:.25mm solid var(--peach);border-radius:99px;padding:.3mm 1.8mm}
.qs{display:flex;flex-direction:column;gap:1.2mm}
.qs div{display:flex;gap:1.6mm;align-items:center;font-size:3.05mm;font-weight:700;background:var(--card);border-radius:2.5mm;padding:.75mm 2mm}
.qs i{font-style:normal;flex:0 0 4mm;height:4mm;border-radius:50%;background:var(--peach);color:#fff;display:grid;place-items:center;font-size:2.4mm;font-weight:800}
.m{font-size:2.75mm;line-height:1.45;text-align:center;font-weight:700;background:rgba(213,221,191,.75);border-radius:3mm;padding:1mm 2mm}
.bottom{margin-top:auto;display:flex;gap:2.5mm;align-items:center;background:#fff;border-radius:3mm;padding:1.2mm}
.bottom img{width:18mm;height:18mm}
.bottom div{display:flex;flex-direction:column;font-size:2.55mm;line-height:1.35;font-weight:600}
.bottom b{font-size:2.9mm}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:right;font-weight:800;font-size:3.1mm}
</style>
</head><body>
<div class="page">
  <div class="head"><img src="../img/logo-hd.png" alt="רותם סגל"></div>
  <h1>רגע של התבוננות</h1>
  <p class="k">סימני עייפות אפשריים:</p>
  <div class="cues"><span>פיהוקים</span><span>הסטת מבט</span><span>ירידה בעניין</span><span>אי־שקט</span><span>קושי להירגע</span></div>
  <p class="k">לפני שמרדימים, שאלי את עצמך:</p>
  <div class="qs">
    <div><i>1</i>מתי הוא ישן לאחרונה?</div>
    <div><i>2</i>מתי הוא אכל?</div>
    <div><i>3</i>מה קרה סביבו עכשיו?</div>
  </div>
  <div class="bottom">
    <img src="../qr/qr-rotem-guide-logo.png" alt="">
    <div><b>המדריך המלא בסריקה</b><span>שאלה? כתבי לי בוואטסאפ</span><span class="ltr">052-4700409</span></div>
  </div>
</div>
</body></html>
