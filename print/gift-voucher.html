<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>שובר מתנה ללידה</title>
<link rel="stylesheet" href="common.css">
<style>
@page{size:210mm 99mm;margin:0}
.page{width:210mm;height:99mm;display:grid;grid-template-columns:1fr 62mm}
.txt{padding:9mm 11mm 8mm;display:flex;flex-direction:column;gap:2.4mm}
.k{font-size:3.6mm;font-weight:700;color:var(--deep);letter-spacing:.3mm}
h1{font-family:var(--hand);font-size:11mm;line-height:1.15}
.what{font-size:4.6mm;font-weight:700}
.desc{font-size:3.5mm;color:var(--soft);line-height:1.5}
.fields{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:3mm 7mm}
.f{display:flex;gap:2mm;align-items:flex-end;font-size:3.7mm;font-weight:700}
.f i{flex:1;border-bottom:.35mm solid var(--soft);height:5mm}
.f.wide{grid-column:1/-1}
.side{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7mm;gap:1.5mm}
.side img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  -webkit-mask-image:linear-gradient(270deg,transparent 0,#000 30%);mask-image:linear-gradient(270deg,transparent 0,#000 30%)}
.side .logo{position:relative;width:24mm;height:24mm;border-radius:50%;box-shadow:0 1mm 4mm rgba(0,0,0,.15)}
.side p{position:relative;font-size:3.2mm;font-weight:700;background:rgba(255,251,247,.92);border-radius:99px;padding:.8mm 3mm;direction:ltr}
/* gift sign A5 */
.sign{width:148mm;height:210mm;padding:14mm 13mm;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5mm}
.sign h2{font-family:var(--hand);font-size:13mm;line-height:1.2}
.sign .lead{font-size:5.6mm;line-height:1.55}
.sign .ph{width:100%;height:62mm;object-fit:cover;border-radius:8mm}
.sign ul{list-style:none;display:flex;flex-direction:column;gap:2.5mm;font-size:5mm;font-weight:700}
.sign ul li::before{content:"♡ ";color:var(--deep)}
.sign .ask{margin-top:auto;background:var(--deep);color:#fff;border-radius:99px;padding:3.5mm 9mm;font-size:5.4mm;font-weight:800}
</style></head><body>
<div class="page">
  <div class="txt">
    <span class="k">מתנה ללידה</span>
    <h1>שובר להדרכה אישית<br>עם רותם סגל</h1>
    <p class="what">להכיר את התינוק, להבין מה הוא צריך, ולבנות ביטחון הורי</p>
    <p class="desc">פגישת הדרכה אישית להורים, בהתאמה לשלב שבו אתם נמצאים: הטרימסטר הרביעי, שינה והרגלי שינה, ומה שעוד יעלה בדרך.</p>
    <div class="fields">
      <div class="f">עבור:<i></i></div>
      <div class="f">מאת:<i></i></div>
      <div class="f">בתוקף עד:<i></i></div>
      <div class="f">מס׳ שובר:<i></i></div>
      <div class="f wide">ברכה:<i></i></div>
    </div>
  </div>
  <div class="side">
    <img class="ph" src="../img/feet.jpg" alt="">
    <img class="logo" src="../img/logo.jpg" alt="">
    <p>052-4700409</p>
  </div>
</div>
</body></html>
